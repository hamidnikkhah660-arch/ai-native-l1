name: Rust validation

on:
  push:
    branches: [main, "ci/**", "public/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Format, check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src/native/pow_bench
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install stable formatter
        run: |
          rustup update stable
          rustup component add rustfmt --toolchain stable
          rustc +stable --version
          cargo +stable --version

      - name: Verify independent monetary Genesis snapshot oracle
        run: python3 ../../../simulations/cp0361_monetary_genesis_snapshot_oracle.py

      - name: Verify independent candidate issuance schedule oracle
        run: python3 ../../../simulations/cp0366_monetary_issuance_oracle_candidate.py --check

      - name: Verify CP-0422 canonical tokenomics and historical-version boundary
        run: python3 ../../../simulations/quantumzxb_tokenomics_checker.py

      - name: Verify CP-0397 v0.4 mining schedule candidate oracle
        run: python3 ../../../simulations/quantumzxb_v04_issuance_schedule_vectors.py --check

      - name: Verify CP-0398/CP-0400/CP-0403 v0.4 profile, transition, snapshot and execution oracle
        run: python3 ../../../simulations/quantumzxb_v04_transition_profile_vectors.py --check

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Check every target
        run: cargo +stable check --all-targets --locked

      - name: Test every target
        # Serialize in-process tests: some filesystem-lock/recovery probes spawn child processes
        # and must not race with other lock probes on constrained hosted runners.
        run: cargo +stable test --all-targets --locked -- --test-threads=1

  windows-pmt4-loopback:
    name: Windows PMT4 TXN4 two-node loopback
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: Run signed TXN4 submit, invalid-signature rejection, peer propagation and replay
        shell: pwsh
        run: ./simulations/cp0363_txn4_two_node_loopback.ps1

      - name: Run PFM4 paged archive sync with inter-page reorg and stale-cursor rejection
        shell: pwsh
        run: ./simulations/cp0362_pfm4_page2_cursor_reorg.ps1

      - name: Run QZBE signed transaction, invalid-signature atomic rejection, replay and public-bind guard
        shell: pwsh
        run: ./simulations/cp0414_qzbe_authenticated_transaction_loopback.ps1
      - name: Run QZBE store-profile lock, signed transaction and legacy downgrade guard through devnet_node
        shell: pwsh
        run: ./simulations/cp0415_devnet_qzbe_dispatch_transaction_loopback.ps1
