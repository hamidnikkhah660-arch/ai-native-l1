name: Bug report
description: Report a reproducible defect in the research prototype
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Do not include private keys, wallet seeds, credentials, personal data, or security-sensitive exploit details. Use the Security tab for vulnerability reports."
  - type: input
    id: commit
    attributes:
      label: Commit or release snapshot
      description: Commit hash or public release tag
      placeholder: "public-source-preview-2026-10-20"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, toolchain versions, configuration and whether this is a research-only path
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Minimal numbered steps that reproduce the issue
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs and test output
      description: Remove keys, tokens, personal data and any secret-looking values before posting
    validations:
      required: true
