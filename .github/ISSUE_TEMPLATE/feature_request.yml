name: Feature request
description: Propose a user- or developer-facing improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What problem does this solve and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the expected behavior and user workflow
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
    validations:
      required: false
  - type: textarea
    id: validation
    attributes:
      label: How to validate success
      description: Define measurable outcomes, tests, failure modes and security impact
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Feature requests are proposals, not commitments to a production release, listing, token price, or investment return."
